name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Derive version from Git tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Bumping version to: $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          
          # Also sync plugin.json
          bun -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf-8"));
            const plugin = JSON.parse(readFileSync("plugin.json", "utf-8"));
            plugin.version = pkg.version;
            writeFileSync("plugin.json", JSON.stringify(plugin, null, 2) + "\n");
          '

      - name: Build package
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure modern npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "Skipping $name@$version (already published)"
            exit 0
          fi
          echo "Publishing $name@$version"
          npm publish --access public --provenance --ignore-scripts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
